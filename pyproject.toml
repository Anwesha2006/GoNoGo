[build-system]
requires=["setuptools>=61"]
build-backend="setuptools.build-meta"

[project]
name="gonogo"
version="1.0.0"
description = "Pre-deployment risk scanner for AI agents"
requires-python = ">=3.10"
dependencies = [
    "typer",
]

[project.scripts]
gonogo = "gonogo.cli:app"

[tool.setuptools.packages.find]
where = ["src"]